[package]
name = "certval-cms"
version = "0.1.0-rc.1"
description = """
Cryptographic Message Syntax (CMS) for certval. Builds, decrypts, signs and verifies EnvelopedData,
AuthEnvelopedData and SignedData with every cryptographic operation performed by a pluggable
implementation, so a message can be processed with the platform's validated cryptographic module
rather than an in-process software implementation.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-cms"
categories = ["cryptography", "no-std"]
keywords = ["cms", "pkcs7", "x509", "certval", "encryption"]
readme = "README.md"
edition = "2021"
rust-version = "1.89"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
# certval's software RSA signature verification, for SignedData signed with RSA when no provider in
# the PkiEnvironment verifies RSA. Off by default, so that the application, not this crate, decides
# which algorithms certval's software offers.
rsa = ["certval/rsa"]
# ML-DSA and SLH-DSA (its SHA2 parameter sets): signing with SoftwareSigningKey, and certval's software
# ML-DSA and SLH-DSA signature verification.
pqc = ["dep:ml-dsa", "dep:slh-dsa", "certval/pqc"]

[dependencies]
# Certificate vetting: path building, validation, and revocation checked against what the
# PkiEnvironment holds. `revocation` adds that local check without std or networking.
certval = { version = "0.2.0-rc.3", default-features = false, features = ["revocation"] }

# The ASN.1 types, reused unchanged. The builders are this crate's, so that every cryptographic
# operation can be routed to a provider, and so that nothing needs `std`.
cms = "=0.3.0-rc.2"
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"
x509-cert = { version = "0.3.0", default-features = false }
zeroize = { version = "1.8.1", features = ["alloc"] }

# The software implementations: content encryption, RSA key transport, ECDH key agreement with
# the X9.63 KDF, ML-KEM with HKDF, and AES key wrap.
aes = "0.9.1"
aes-gcm = "0.11.0"
aes-kw = "0.3.1"
ansi-x963-kdf = "0.1.0"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
elliptic-curve = { version = "0.14.3", default-features = false, features = ["alloc", "arithmetic", "ecdh", "pkcs8", "sec1"] }
getrandom = { version = "0.4.1", features = ["sys_rng"] }
hkdf = "0.13.0"
ml-kem = { version = "0.3.3", features = ["pkcs8", "zeroize"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }
sha1 = { version = "0.11.0", default-features = false, features = ["oid"] }
sha2 = { version = "0.11.0", default-features = false, features = ["oid"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
# The version certval pins, so that one copy is built.
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, features = ["alloc", "zeroize"], optional = true }
# The Signer trait, for SignerCredential, which adapts any signer that knows its algorithm.
signature = { version = "3.0.0", features = ["alloc"] }
# Constant-time examination of PKCS #1 v1.5 padding after a raw RSA decryption.
subtle = { version = "2.6.1", default-features = false }
# The random number generator trait cms's recipient builders take.
rand_core = "0.10.1"
log = "0.4.35"

[dev-dependencies]
# The tests decrypt what is built, with RustCrypto and with the openssl command. cms's own key
# transport recipient builder stands in for a recipient whose key management lies elsewhere.
cms = { version = "=0.3.0-rc.2", features = ["builder"] }
ml-kem = { version = "0.3.3", features = ["pkcs8", "pem"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem"] }
p384 = { version = "0.14.0", features = ["ecdh", "pem"] }
p521 = { version = "0.14.0", features = ["ecdh", "pem"] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
tempfile = "3.27.0"
# The vetting and SignedData tests' PkiEnvironment: std so that the time of interest defaults to
# now, and certval's software RSA so that RSA signatures have an implementation to verify them.
certval = { version = "0.2.0-rc.3", default-features = false, features = ["revocation", "rsa", "std"] }
ml-dsa = { version = "0.1.1", features = ["pkcs8"] }
# Certificates for the decryption and vetting tests' recipients, issued by a P-256 test CA.
x509-cert = { version = "0.3.0", features = ["builder", "pem", "std"] }
der = { version = "0.8.3", features = ["flagset"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

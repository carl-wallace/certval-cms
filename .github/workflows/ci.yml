name: certval-cms

on:
  pull_request:
  push:
    branches: main
  # Manual re-runs via `gh workflow run ci.yml` (available once this file is
  # on the default branch).
  workflow_dispatch:

defaults:
  run:
    working-directory: certval-cms

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust:
          - 1.89.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cms
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --all-targets
      - run: cargo build --all-targets --all-features

  # Lints run on stable only, deliberately not across the build matrix: clippy's diagnostics differ
  # between toolchains, so linting against the MSRV pin reports on a compiler nobody develops with.
  # The pre-commit hook runs the same commands locally so they fail before a push rather than in
  # CI. It is an early warning, not a replacement for these jobs.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cms
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: clippy
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --all-features

  # A job of its own so it can be a required check without making clippy one: each Rust release
  # adds lints, and a required clippy would fail unrelated pull requests.
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cms
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: rustfmt
      - run: cargo fmt --check

  # The round trips, plus decryption of the same messages by the runner's `openssl cms`.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cms
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the tests
        env:
          CERTVAL_CMS_OPENSSL: openssl
        run: cargo test --all-features -- --nocapture

  # Ubuntu 24.04's OpenSSL is 3.0, so the job above skips the openssl decryption of ML-KEM recipients
  # (OpenSSL 3.6) and of AuthEnvelopedData with authenticated attributes (OpenSSL 3.6.4, the first to
  # tag authAttrs as RFC 5083 does). This one builds an OpenSSL release with both and gives the tests
  # its openssl command, and fails if any openssl check is skipped. The build is cached by version.
  test-openssl-3-6:
    runs-on: ubuntu-24.04
    env:
      OPENSSL_VERSION: 3.6.5
      OPENSSL_SHA256: a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cms
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the OpenSSL build
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          # The rpath lets the openssl command find its own libraries without LD_LIBRARY_PATH,
          # which would otherwise reach cargo and everything else in the test step.
          ./Configure --prefix="$HOME/openssl" --libdir=lib "-Wl,-rpath,$HOME/openssl/lib"
          make -j"$(nproc)"
          make install_sw

      - name: Run the tests against OpenSSL ${{ env.OPENSSL_VERSION }}
        env:
          CERTVAL_CMS_OPENSSL: /home/runner/openssl/bin/openssl
        run: |
          set -o pipefail
          "$CERTVAL_CMS_OPENSSL" version
          cargo test --all-features -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -n '^skipped' "$RUNNER_TEMP/test.log"; then
            echo "an openssl check was skipped; this job exists to run them all"
            exit 1
          fi
